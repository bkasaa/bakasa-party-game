    <rect x="-18" y="-76" width="144" height="144" rx="28" transform="rotate(-45 54 -4)" fill="none" stroke="url(#pinkGrad)" stroke-width="26" />
    <circle cx="-54" cy="-4" r="18" fill="#38bdf8" />
    <circle cx="54" cy="-4" r="18" fill="#f472b6" />
